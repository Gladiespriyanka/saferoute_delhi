services:
  - type: web
    name: safeherway-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python fetch_osm_data.py && python train_model.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SAFEROUTE_API_KEYS
        sync: false
      - key: SAFEROUTE_CORS_ORIGINS
        sync: false